[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-cricket"
version = "0.4.1"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
description = "Questionnaire classification using causal-LM token probabilities"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
hf = [
    "pillow>=10,<13",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "transformers>=5.2,<6",
]
mlx = [
    "mlx-lm>=0.30.7,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm[torch]==0.3.12 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]
langchain = ["langchain-core>=1,<2"]
langgraph = ["langchain-core>=1,<2", "langgraph>=1,<2"]
server = ["langchain-core>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["langchain-core>=1,<2", "langgraph>=1,<2", "fastapi>=0.115,<1", "httpx>=0.27,<1", "typesafe-sdk>=0.7,<0.8"]

[project.scripts]
open-cricket = "open_cricket.cli:main"

[tool.setuptools.packages.find]
include = ["open_cricket*"]
